services:
  postgres:
    image: postgres:17
    container_name: event-driven-orders-postgres

    environment:
      POSTGRES_DB: orders
      POSTGRES_USER: postgres_admin
      POSTGRES_PASSWORD: admin_password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres_admin -d orders"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: